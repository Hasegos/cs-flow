name: CS Flow CI/CD

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest # 빌드 작업대

    steps:
      # 소스코드 가져오기
      - name: 소스 코드 가져오기
        uses: actions/checkout@v3

      # 자바 환경 셋팅
      - name: 자바 환경 셋팅
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Node.js 환경 셋팅 (난독화 도구용)
      - name: Node.js 환경 셋팅
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      # JS 파일 난독화 + 저작권 헤더 주입 / CSS 파일 minify
      # 헤더는 난독화 "이후"에 주입한다: 난독화 도구가 일반 주석을 제거하므로
      - name: JS 파일 난독화 + 저작권 헤더 주입 / CSS 파일 minify
        run: |
          npm install -g javascript-obfuscator clean-css-cli

          COPYRIGHT_HEADER='/*! © 2025-2026 CS Flow. All rights reserved. 무단 복제·재배포·리버스 엔지니어링 금지. */'

          find src/main/resources/static/js -name "*.js" | while read f; do
            javascript-obfuscator "$f" --output "$f" \
              --compact true \
              --identifier-names-generator hexadecimal \
              --rename-globals false \
              --self-defending false \
              --string-array true \
              --string-array-threshold 0.75

            tmp="$(mktemp)"
            { printf '%s\n' "$COPYRIGHT_HEADER"; cat "$f"; } > "$tmp" && mv "$tmp" "$f"

            echo "난독화 + 헤더 주입 완료: $f"
          done

          find src/main/resources/static/css -name "*.css" | while read f; do
            cleancss -o "$f" "$f"
            echo "CSS minify 완료: $f"
          done

      # maven 으로 jar 빌드
      - name: maven jar 빌드
        run: |
          chmod +x mvnw
          ./mvnw clean package -DskipTests

      # 빌드된 jar 파일 Rocky linux로 전달 (SCP)
      - name: 빌드된 jar 파일 Rocky linux로 전달
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "target/cs-flow-0.0.1-SNAPSHOT.jar"
          target: "/root/workspace/cs-flow"
          rm: false

      # 서버에 접속해서 서비스 재시작
      - name: 서버에 접속해서 서비스 재시작
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.REMOTE_IP }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # 새 파일에 대한 보안 라벨 갱신 
            restorecon -v /root/workspace/cs-flow/target/cs-flow-0.0.1-SNAPSHOT.jar
            
            # systemctl 서비스 재시작
            systemctl restart cs-flow.service
            
            # 5초 대기후 서비스 상태 확인
            sleep 5
            systemctl is-active cs-flow.service