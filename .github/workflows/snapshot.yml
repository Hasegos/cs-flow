name: CS Flow Snapshot

on:
  workflow_run:
    workflows: ["CS Flow CI/CD"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      # 소스코드 가져오기 (굽기 스크립트)
      - name: 소스 코드 가져오기
        uses: actions/checkout@v4

      # 파이썬 환경 셋팅
      - name: 파이썬 환경 셋팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 운영 사이트를 크롤링해서 dist 폴더에 저장 (검증에 실패하면 여기서 멈추고 이전 스냅샷이 남는다)
      - name: 스냅샷 굽기
        run: python scripts/bake_snapshot.py dist

      # 구운 dist를 Cloudflare Pages에 배포
      - name: Cloudflare Pages 배포
        run: npx --yes wrangler@4 pages deploy dist --project-name csflow-snapshot --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
