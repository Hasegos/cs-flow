<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <meta name="author" content="CS Flow">
    <title th:text="${subject.name} + ' CS 지식 정리 | CS Flow'">컴퓨터 구조 CS 지식 정리 | CS Flow</title>
    <link rel="stylesheet" th:href="@{/css/pages/subject.css}">
</head>
<body>
    <!-- 헤더 -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <main>
        <!-- 과목 히어로 -->
        <section class="subject-hero" th:style="'--subject-accent: ' + ${subject.colorAccent}">
            <div class="subject-hero__bg-grid"></div>
            <div class="subject-hero__glow"></div>

            <div class="subject-hero__inner">
                <div class="subject-hero__breadcrumb">
                    <a th:href="@{/}" class="subject-hero__breadcrumb-home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        홈
                    </a>
                    <span class="subject-hero__breadcrumb-sep">/</span>
                    <span class="subject-hero__breadcrumb-current" th:text="${subject.name}">과목명</span>
                </div>

                <div class="subject-hero__meta">
                    <span class="subject-hero__slug" th:text="${subject.slug}">arch</span>
                </div>
                <h1 class="subject-hero__title" th:text="${subject.name}">컴퓨터 구조</h1>
                <p class="subject-hero__count">
                    <span th:text="${totalElements}">0</span><th:block th:text="${filtered} ? '개 검색 결과' : '개 토픽'">개 토픽</th:block>
                </p>
            </div>
        </section>

        <!-- 토픽 목록 -->
        <section class="topic-list">
            <div class="topic-list__inner">

                <!-- 검색 + 태그 필터 -->
                <div class="topic-filter" th:if="${filtered or not #lists.isEmpty(topics)}"
                     th:style="'--subject-accent: ' + ${subject.colorAccent}">
                    <form class="topic-filter__form" role="search" method="get"
                          th:action="@{/{slug}(slug=${subject.slug})}">
                        <input type="search" name="q" class="topic-filter__input"
                               th:value="${q}" maxlength="50"
                               placeholder="이 과목에서 제목·태그 검색" aria-label="토픽 검색">
                        <input type="hidden" name="tag" th:if="${tag}" th:value="${tag}">
                        <input type="hidden" name="sort" th:value="${currentSort}">
                        <button type="submit" class="topic-filter__submit">검색</button>
                    </form>
                </div>

                <!-- 결과 (입력 중 실시간 검색 시 이 영역만 교체) -->
                <div class="topic-results" id="topic-results">
                <div class="topic-filter__meta" th:if="${filtered or not #lists.isEmpty(tags)}"
                     th:style="'--subject-accent: ' + ${subject.colorAccent}">
                    <div class="topic-filter__tags" th:if="${not #lists.isEmpty(tags)}">
                        <a th:href="@{/{slug}(slug=${subject.slug}, sort=${currentSort})} + ${qQs}"
                           th:classappend="${tag == null} ? ' is-active' : ''"
                           class="topic-filter__tag">전체</a>
                        <a th:each="t : ${tags}"
                           th:href="${t.tag == tag} ? (@{/{slug}(slug=${subject.slug}, sort=${currentSort})} + ${qQs}) : (@{/{slug}(slug=${subject.slug}, sort=${currentSort}, tag=${t.tag})} + ${qQs})"
                           th:classappend="${t.tag == tag} ? ' is-active' : ''"
                           class="topic-filter__tag">
                            <span th:text="${t.tag}">태그</span>
                            <span class="topic-filter__tag-count" th:text="${t.count}">0</span>
                        </a>
                    </div>

                    <p class="topic-filter__summary" th:if="${filtered}">
                        <th:block th:if="${q}">"<span th:text="${q}">검색어</span>"</th:block>
                        <th:block th:if="${tag}">#<span th:text="${tag}">태그</span></th:block>
                        검색 결과 <span th:text="${totalElements}">0</span>개
                        <a th:href="@{/{slug}(slug=${subject.slug}, sort=${currentSort})}" class="topic-filter__reset">필터 초기화</a>
                    </p>
                </div>

                <!-- 정렬 -->
                <div class="topic-list__sort" th:if="${not #lists.isEmpty(topics)}">
                    <a th:href="@{/{slug}(slug=${subject.slug}, sort='default')} + ${filterQs}"
                       th:classappend="${currentSort == 'default'} ? ' is-active' : ''"
                       class="topic-list__sort-btn">기본순</a>
                    <a th:href="@{/{slug}(slug=${subject.slug}, sort='view')} + ${filterQs}"
                       th:classappend="${currentSort == 'view'} ? ' is-active' : ''"
                       class="topic-list__sort-btn">조회순</a>
                    <a th:href="@{/{slug}(slug=${subject.slug}, sort='like')} + ${filterQs}"
                       th:classappend="${currentSort == 'like'} ? ' is-active' : ''"
                       class="topic-list__sort-btn">인기순</a>
                </div>

                <!-- 토픽 있을 때 -->
                <div class="topic-grid" th:if="${not #lists.isEmpty(topics)}"
                     th:style="'--subject-accent: ' + ${subject.colorAccent}">
                    <a th:each="topic, stat : ${topics}"
                       th:href="@{/{subjectSlug}/{topicSlug}(subjectSlug=${subject.slug}, topicSlug=${topic.slug})}"
                       class="topic-card"
                       th:style="'--card-index: ' + ${stat.index}">

                        <div class="topic-card__number">
                            <span th:text="${#strings.toString(stat.count).length() == 1 ? '0' + stat.count : stat.count}">01</span>
                        </div>

                        <div class="topic-card__body">
                            <h3 class="topic-card__title" th:text="${topic.title}">토픽 제목</h3>
                            <div class="topic-card__tags" th:if="${not #lists.isEmpty(topic.tags)}">
                                    <span th:each="tag : ${topic.tags}"
                                          class="topic-card__tag"
                                          th:text="${tag.tag}">태그</span>
                            </div>
                            <div class="topic-card__stats">
                                <span class="topic-card__stat" th:text="'조회 ' + ${topic.viewCount}">조회 0</span>
                                <span class="topic-card__stat" th:text="'추천 ' + ${topic.likeCount}">추천 0</span>
                            </div>
                        </div>

                        <div class="topic-card__arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </div>
                    </a>
                </div>

                <!-- 페이지네이션 -->
                <nav class="pagination" th:if="${totalPages > 1}" aria-label="토픽 페이지 네비게이션">
                    <!-- 이전 버튼 -->
                    <a th:if="${currentPage > 0}"
                       th:href="@{/{slug}(slug=${subject.slug}, page=${currentPage - 1}, sort=${currentSort})} + ${filterQs}"
                       class="pagination__btn pagination__btn--prev"
                       aria-label="이전 페이지">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </a>
                    <span th:if="${currentPage == 0}"
                          class="pagination__btn pagination__btn--disabled"
                          aria-disabled="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </span>

                    <!-- 페이지 번호 -->
                    <th:block th:each="p : ${pageRange}">
                        <span th:if="${p == -1}" class="pagination__ellipsis">…</span>
                        <a th:if="${p != -1 && p != currentPage}"
                           th:href="@{/{slug}(slug=${subject.slug}, page=${p}, sort=${currentSort})} + ${filterQs}"
                           class="pagination__btn pagination__num"
                           th:text="${p + 1}">1</a>
                        <span th:if="${p != -1 && p == currentPage}"
                              class="pagination__btn pagination__num pagination__num--active"
                              th:text="${p + 1}">1</span>
                    </th:block>

                    <!-- 다음 버튼 -->
                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/{slug}(slug=${subject.slug}, page=${currentPage + 1}, sort=${currentSort})} + ${filterQs}"
                       class="pagination__btn pagination__btn--next"
                       aria-label="다음 페이지">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>
                    <span th:if="${currentPage == totalPages - 1}"
                          class="pagination__btn pagination__btn--disabled"
                          aria-disabled="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </nav>

                <!-- 토픽 없을 때 -->
                <div class="topic-empty" th:if="${#lists.isEmpty(topics)}">
                    <div class="topic-empty__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <th:block th:if="${filtered}">
                        <p class="topic-empty__text">조건에 맞는 토픽이 없어요.</p>
                        <p class="topic-empty__sub">다른 검색어나 태그로 찾아보세요.</p>
                        <a th:if="${q}" th:href="@{/search(q=${q})}" class="topic-filter__global">
                            전체 과목에서 "<span th:text="${q}">검색어</span>" 검색하기
                        </a>
                        <a th:href="@{/{slug}(slug=${subject.slug})}" class="btn btn--ghost">필터 초기화</a>
                    </th:block>
                    <th:block th:unless="${filtered}">
                        <p class="topic-empty__text">아직 준비 중인 과목이에요.</p>
                        <p class="topic-empty__sub">곧 업데이트될 예정이에요.</p>
                        <a th:href="@{/}" class="btn btn--ghost">홈으로 돌아가기</a>
                    </th:block>
                </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 푸터 -->
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

    <script th:src="@{/js/common.js}"></script>
    <script th:src="@{/js/search.js}"></script>
</body>
</html>
