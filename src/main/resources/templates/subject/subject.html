<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <th:block th:replace="~{fragments/head :: head}"></th:block>
    <meta name="author" content="CS Flow">
    <title th:text="${subject.name} + ' CS 지식 정리 | CS Flow'">컴퓨터 구조 CS 지식 정리 | CS Flow</title>
    <link rel="stylesheet" th:href="@{/css/pages/subject.css}">
</head>
<body>
    <!-- 헤더 -->
    <th:block th:replace="~{fragments/header :: header}"></th:block>

    <main>
        <!-- 과목 히어로 -->
        <section class="subject-hero" th:style="'--subject-accent: ' + ${subject.colorAccent}">
            <div class="subject-hero__bg-grid"></div>
            <div class="subject-hero__glow"></div>

            <div class="subject-hero__inner">
                <div class="subject-hero__breadcrumb">
                    <a th:href="@{/}" class="subject-hero__breadcrumb-home">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                            <polyline points="9 22 9 12 15 12 15 22"/>
                        </svg>
                        홈
                    </a>
                    <span class="subject-hero__breadcrumb-sep">/</span>
                    <span class="subject-hero__breadcrumb-current" th:text="${subject.name}">과목명</span>
                </div>

                <div class="subject-hero__meta">
                    <span class="subject-hero__slug" th:text="${subject.slug}">arch</span>
                </div>
                <h1 class="subject-hero__title" th:text="${subject.name}">컴퓨터 구조</h1>
                <p class="subject-hero__count">
                    <span th:text="${totalElements}">0</span>개 토픽
                </p>
            </div>
        </section>

        <!-- 토픽 목록 -->
        <section class="topic-list">
            <div class="topic-list__inner">

                <!-- 토픽 있을 때 -->
                <div class="topic-grid" th:if="${not #lists.isEmpty(topics)}"
                     th:style="'--subject-accent: ' + ${subject.colorAccent}">
                    <a th:each="topic, stat : ${topics}"
                       th:href="@{/{subjectSlug}/{topicSlug}(subjectSlug=${subject.slug}, topicSlug=${topic.slug})}"
                       class="topic-card"
                       th:style="'--card-index: ' + ${stat.index}">

                        <div class="topic-card__number">
                            <span th:text="${#strings.toString(stat.count).length() == 1 ? '0' + stat.count : stat.count}">01</span>
                        </div>

                        <div class="topic-card__body">
                            <h3 class="topic-card__title" th:text="${topic.title}">토픽 제목</h3>
                            <div class="topic-card__tags" th:if="${not #lists.isEmpty(topic.tags)}">
                                    <span th:each="tag : ${topic.tags}"
                                          class="topic-card__tag"
                                          th:text="${tag.tag}">태그</span>
                            </div>
                        </div>

                        <div class="topic-card__arrow">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                 stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"/>
                                <polyline points="12 5 19 12 12 19"/>
                            </svg>
                        </div>
                    </a>
                </div>

                <!-- 페이지네이션 -->
                <nav class="pagination" th:if="${totalPages > 1}" aria-label="토픽 페이지 네비게이션">
                    <!-- 이전 버튼 -->
                    <a th:if="${currentPage > 0}"
                       th:href="@{/{slug}(slug=${subject.slug}, page=${currentPage - 1})}"
                       class="pagination__btn pagination__btn--prev"
                       aria-label="이전 페이지">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </a>
                    <span th:if="${currentPage == 0}"
                          class="pagination__btn pagination__btn--disabled"
                          aria-disabled="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="15 18 9 12 15 6"/>
                        </svg>
                    </span>

                    <!-- 페이지 번호 -->
                    <th:block th:each="p : ${pageRange}">
                        <span th:if="${p == -1}" class="pagination__ellipsis">…</span>
                        <a th:if="${p != -1 && p != currentPage}"
                           th:href="@{/{slug}(slug=${subject.slug}, page=${p})}"
                           class="pagination__btn pagination__num"
                           th:text="${p + 1}">1</a>
                        <span th:if="${p != -1 && p == currentPage}"
                              class="pagination__btn pagination__num pagination__num--active"
                              th:text="${p + 1}">1</span>
                    </th:block>

                    <!-- 다음 버튼 -->
                    <a th:if="${currentPage < totalPages - 1}"
                       th:href="@{/{slug}(slug=${subject.slug}, page=${currentPage + 1})}"
                       class="pagination__btn pagination__btn--next"
                       aria-label="다음 페이지">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </a>
                    <span th:if="${currentPage == totalPages - 1}"
                          class="pagination__btn pagination__btn--disabled"
                          aria-disabled="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                             stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="9 18 15 12 9 6"/>
                        </svg>
                    </span>
                </nav>

                <!-- 토픽 없을 때 -->
                <div class="topic-empty" th:if="${#lists.isEmpty(topics)}">
                    <div class="topic-empty__icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="12" y1="8" x2="12" y2="12"/>
                            <line x1="12" y1="16" x2="12.01" y2="16"/>
                        </svg>
                    </div>
                    <p class="topic-empty__text">아직 준비 중인 과목이에요.</p>
                    <p class="topic-empty__sub">곧 업데이트될 예정이에요.</p>
                    <a th:href="@{/}" class="btn btn--ghost">홈으로 돌아가기</a>
                </div>
            </div>
        </section>
    </main>

    <!-- 푸터 -->
    <th:block th:replace="~{fragments/footer :: footer}"></th:block>

    <script th:src="@{/js/common.js}"></script>
</body>
</html>
