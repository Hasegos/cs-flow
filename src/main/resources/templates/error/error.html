<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CS Flow - 오류</title>
    <link rel="stylesheet" th:href="@{/css/common/reset.css}">
    <link rel="stylesheet" th:href="@{/css/pages/error.css}">
</head>
<body>

    <!-- 모서리 장식 -->
    <span class="error-decoration error-decoration--tl">cs_flow // error</span>
    <span class="error-decoration error-decoration--br">system.halt()</span>

    <div class="error-container">

        <!-- 아이콘 -->
        <div class="error-icon">
            <div class="error-icon__ring"></div>
            <div class="error-icon__ring"></div>
            <div class="error-icon__ring"></div>
            <div class="error-icon__core">
                <svg viewBox="0 0 24 24" fill="none" stroke="#6c63ff" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="12"/>
                    <line x1="12" y1="16" x2="12.01" y2="16"/>
                </svg>
            </div>
        </div>

        <!-- 텍스트 -->
        <p class="error-code">signal lost</p>
        <h1 class="error-title">앗, 문제가 발생했어요.</h1>
        <p class="error-message" th:text="${message}">
            요청하신 페이지를 찾을 수 없거나 서버에 오류가 발생했어요.
        </p>

        <!-- 홈으로 버튼 -->
        <a href="/" class="error-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
            </svg>
            홈으로 돌아가기
        </a>
    </div>

</body>
</html>
