<header th:fragment="header" class="gnb">
    <div class="gnb__inner">
        <a th:href="@{/}" class="gnb__logo">
            <img th:src="@{/img/csflow_icon.svg}"       alt="CS Flow 로고" class="gnb__logo-icon gnb__logo-icon--dark">
            <img th:src="@{/img/csflow_icon_light.svg}" alt="CS Flow 로고" class="gnb__logo-icon gnb__logo-icon--light">
            <span class="gnb__logo-text">
                <span class="gnb__logo-cs">CS</span>
                <span class="gnb__logo-flow"> Flow</span>
            </span>
        </a>

        <nav class="gnb__nav">
            <a th:href="@{/arch}"    class="gnb__nav-item" th:classappend="${currentSubject == 'arch'}    ? ' is-active'">컴퓨터 구조</a>
            <a th:href="@{/os}"      class="gnb__nav-item" th:classappend="${currentSubject == 'os'}      ? ' is-active'">운영체제</a>
            <a th:href="@{/network}" class="gnb__nav-item" th:classappend="${currentSubject == 'network'} ? ' is-active'">네트워크</a>
            <a th:href="@{/ds}"      class="gnb__nav-item" th:classappend="${currentSubject == 'ds'}      ? ' is-active'">자료구조</a>
            <a th:href="@{/algo}"    class="gnb__nav-item" th:classappend="${currentSubject == 'algo'}    ? ' is-active'">알고리즘</a>
            <a th:href="@{/db}"      class="gnb__nav-item" th:classappend="${currentSubject == 'db'}      ? ' is-active'">데이터베이스</a>
        </nav>

        <!-- 테마 토글 -->
        <button class="gnb__theme-btn" id="themeToggleBtn" aria-label="테마 전환">
            <svg class="gnb__theme-icon gnb__theme-icon--dark" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="gnb__theme-icon gnb__theme-icon--light" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>

        <button class="gnb__hamburger" id="hamburgerBtn" aria-label="메뉴 열기">
            <span class="gnb__hamburger-line"></span>
            <span class="gnb__hamburger-line"></span>
            <span class="gnb__hamburger-line"></span>
        </button>
    </div>

    <div class="gnb__drawer" id="gnbDrawer">
        <a th:href="@{/arch}"    class="gnb__drawer-item" th:classappend="${currentSubject == 'arch'}    ? ' is-active'">컴퓨터 구조</a>
        <a th:href="@{/os}"      class="gnb__drawer-item" th:classappend="${currentSubject == 'os'}      ? ' is-active'">운영체제</a>
        <a th:href="@{/network}" class="gnb__drawer-item" th:classappend="${currentSubject == 'network'} ? ' is-active'">네트워크</a>
        <a th:href="@{/ds}"      class="gnb__drawer-item" th:classappend="${currentSubject == 'ds'}      ? ' is-active'">자료구조</a>
        <a th:href="@{/algo}"    class="gnb__drawer-item" th:classappend="${currentSubject == 'algo'}    ? ' is-active'">알고리즘</a>
        <a th:href="@{/db}"      class="gnb__drawer-item" th:classappend="${currentSubject == 'db'}      ? ' is-active'">데이터베이스</a>
    </div>
</header>
