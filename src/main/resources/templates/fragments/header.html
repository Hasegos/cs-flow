<th:block th:fragment="header">
<header class="gnb">
    <div class="gnb__inner">
        <a th:href="@{/}" class="gnb__logo">
            <img th:src="@{/img/csflow_icon.svg}"       alt="CS Flow 로고" class="gnb__logo-icon gnb__logo-icon--dark">
            <img th:src="@{/img/csflow_icon_light.svg}" alt="CS Flow 로고" class="gnb__logo-icon gnb__logo-icon--light">
            <span class="gnb__logo-text">
                <span class="gnb__logo-cs">CS</span>
                <span class="gnb__logo-flow"> Flow</span>
            </span>
        </a>

        <nav class="gnb__nav">
            <a th:each="s : ${navSubjects}" th:href="@{/{slug}(slug=${s.slug})}" class="gnb__nav-item"
               th:classappend="${currentSubject == s.slug} ? ' is-active'" th:text="${s.name}">과목</a>
            <a th:href="@{/errors}"  class="gnb__nav-item" th:classappend="${currentSection == 'errors'}  ? ' is-active'">에러 사전</a>
            <a th:href="@{/interview}" class="gnb__nav-item" rel="nofollow" th:classappend="${currentPage == 'interview'} ? ' is-active'">면접 대비</a>
        </nav>

        <!-- 검색 -->
        <a th:href="@{/search}" class="gnb__search-btn" aria-label="검색">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
        </a>

        <!-- 내 학습 -->
        <a th:href="@{/study}" class="gnb__study-btn" th:classappend="${currentPage == 'study'} ? ' is-active'"
           aria-label="내 학습" title="내 학습">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
        </a>

        <!-- 테마 토글 -->
        <button class="gnb__theme-btn" id="themeToggleBtn" aria-label="테마 전환">
            <svg class="gnb__theme-icon gnb__theme-icon--dark" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="5"/>
                <line x1="12" y1="1" x2="12" y2="3"/>
                <line x1="12" y1="21" x2="12" y2="23"/>
                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                <line x1="1" y1="12" x2="3" y2="12"/>
                <line x1="21" y1="12" x2="23" y2="12"/>
                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
            </svg>
            <svg class="gnb__theme-icon gnb__theme-icon--light" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
            </svg>
        </button>
    </div>
</header>

<th:block th:replace="~{fragments/sidebar :: sidebar}"></th:block>
<th:block th:replace="~{fragments/tabbar :: tabbar}"></th:block>
</th:block>
