<th:block th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="Opv_BuoU55HVvcJ-dvr9PrYKpAJVdrLhtKHjhKYKhaQ" />

    <!-- SEO -->
    <meta name="keywords" content="CS지식, 컴퓨터구조, 운영체제, 네트워크, 자료구조, 알고리즘, 데이터베이스, 개발자면접, CS공부">
    <meta name="description" th:if="${topic}" th:content="${topic.metaDescription}">
    <meta name="description" th:unless="${topic}" content="컴퓨터 구조, 운영체제, 네트워크, 자료구조, 알고리즘, 데이터베이스 CS 지식을 인터랙티브 시각화로 학습하세요. 개발자 면접 CS 핵심 개념 총정리.">

    <!-- Canonical -->
    <link rel="canonical" th:href="${canonicalUrl} ?: 'https://csflow.kr/'">

    <!-- OG -->
    <meta property="og:site_name" content="CS Flow">
    <meta property="og:type" content="website">
    <meta property="og:title"
          th:content="${topic != null} ? (${topic.title} + ' | CS 지식 정리 - CS Flow') : 'CS Flow | CS 지식 인터랙티브 학습 플랫폼'">
    <meta property="og:description"
          th:content="${topic != null} ? ${topic.metaDescription} : '컴퓨터 구조, 운영체제, 네트워크, 자료구조, 알고리즘, 데이터베이스 CS 지식을 인터랙티브 시각화로 학습하세요.'">
    <meta property="og:url"
          th:content="${canonicalUrl} ?: 'https://csflow.kr/'">
    <meta property="og:image" content="https://csflow.kr/img/og_image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:site" content="@csflow_kr">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}">
    <link rel="apple-touch-icon" th:href="@{/img/favicon.svg}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap"></noscript>
    <link rel="stylesheet" th:href="@{/css/common/reset.css}">
    <link rel="stylesheet" th:href="@{/css/common/header.css}">
    <link rel="stylesheet" th:href="@{/css/common/footer.css}">

    <!-- JSON-LD -->
    <script type="application/ld+json">
        {
            "@context": "https://schema.org",
            "@type": "WebSite",
            "name": "CS Flow",
            "url": "https://csflow.kr",
            "description": "컴퓨터 구조, 운영체제, 네트워크, 자료구조, 알고리즘, 데이터베이스 CS 지식 인터랙티브 학습 플랫폼"
        }
    </script>

    <script th:if="${topic}" type="application/ld+json" th:inline="javascript">
        {
            "@context": "https://schema.org",
            "@type": "LearningResource",
            "name": [[${topic.title}]],
            "description": [[${topic.metaDescription}]],
            "url": [[${canonicalUrl}]],
            "provider": {
                "@type": "Organization",
                "name": "CS Flow",
                "url": "https://csflow.kr"
            }
        }
    </script>
</th:block>
