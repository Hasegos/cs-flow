<th:block th:fragment="sidebar">
    <!-- 왼쪽 목차. 링크는 항상 내려보내고 좁은 화면에서는 CSS로만 숨긴다 -->
    <aside class="side-nav" th:if="${sideNavItems != null and not #lists.isEmpty(sideNavItems)}"
           th:style="${sideNavAccent != null} ? ('--subject-accent: ' + ${sideNavAccent}) : null">

        <button type="button" class="side-nav__toggle" id="sideNavToggle"
                aria-expanded="false" aria-controls="sideNavPanel">
            <span class="side-nav__toggle-icon" aria-hidden="true"></span>
            <span class="side-nav__toggle-text" th:text="${sideNavTitle}">목차</span>
            <span class="side-nav__toggle-count" th:text="${#lists.size(sideNavItems)}">0</span>
        </button>

        <div class="side-nav__panel" id="sideNavPanel">
            <h2 class="side-nav__title">
                <span th:text="${sideNavTitle}">목차</span>
                <span class="side-nav__count" th:text="${#lists.size(sideNavItems)}">0</span>
            </h2>

            <!-- 학습 진행률 (learning.js가 채운다) -->
            <div class="side-nav__progress" id="sideNavProgress" hidden>
                <div class="side-nav__progress-track">
                    <span class="side-nav__progress-fill" id="sideNavProgressFill"></span>
                </div>
                <span class="side-nav__progress-text" id="sideNavProgressText">0/0</span>
            </div>

            <div class="side-nav__filter">
                <svg class="side-nav__filter-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="11" cy="11" r="7"/>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"/>
                </svg>
                <input type="search" id="sideNavFilter" class="side-nav__filter-input"
                       th:placeholder="${sideNavFilterLabel}"
                       th:attr="aria-label=${sideNavFilterLabel}" autocomplete="off" maxlength="40">
            </div>

            <ol class="side-nav__list" id="sideNavList">
                <li th:each="item : ${sideNavItems}" class="side-nav__item" th:attr="data-key=${item.key}">
                    <a class="side-nav__link"
                       th:classappend="${item.active} ? ' side-nav__link--active' : ''"
                       th:attr="aria-current=${item.active} ? 'page' : null,
                                rel=${item.nofollow} ? 'nofollow' : null"
                       th:href="${item.href}">
                        <span class="side-nav__num" th:if="${item.num}" th:text="${item.num}">01</span>
                        <span class="side-nav__text" th:text="${item.label}">이름</span>
                        <span class="side-nav__tail" th:if="${item.count}" th:text="${item.count}">0</span>
                    </a>
                </li>
            </ol>

            <p class="side-nav__empty" id="sideNavEmpty" hidden>맞는 항목이 없습니다.</p>
        </div>

        <div class="side-nav__resizer" id="sideNavResizer"
             role="separator" aria-orientation="vertical" tabindex="0"
             aria-label="목차 너비 조절" title="드래그해서 너비 조절 (더블클릭하면 기본값)"></div>
    </aside>
</th:block>
