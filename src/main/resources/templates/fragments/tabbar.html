<th:block th:fragment="tabbar">
    <!-- 모바일 하단 탭. 1140px 이상에서는 CSS로 숨긴다 -->
    <nav class="tabbar" aria-label="주요 메뉴">
        <a th:href="@{/}" class="tabbar__item"
           th:classappend="${currentSubject == null and currentSection == null and currentPage == null} ? ' tabbar__item--active'">
            <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span class="tabbar__text">홈</span>
        </a>

        <button type="button" class="tabbar__item" id="tabbarBrowse"
                th:classappend="${currentSubject != null or currentSection == 'errors' or currentPage == 'interview'} ? ' tabbar__item--active'"
                aria-expanded="false" aria-controls="tabbarSheet">
            <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
            </svg>
            <span class="tabbar__text">과목</span>
        </button>

        <a th:href="@{/search}" class="tabbar__item" rel="nofollow"
           th:classappend="${currentPage == 'search'} ? ' tabbar__item--active'">
            <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="7"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            </svg>
            <span class="tabbar__text">검색</span>
        </a>

        <a th:href="@{/study}" class="tabbar__item" rel="nofollow"
           th:classappend="${currentPage == 'study'} ? ' tabbar__item--active'">
            <svg class="tabbar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
            <span class="tabbar__text">내 학습</span>
        </a>
    </nav>

    <div class="tabbar__scrim" id="tabbarScrim" hidden></div>

    <div class="tabbar__sheet" id="tabbarSheet" role="dialog" aria-modal="true" aria-label="과목" hidden>
        <div class="tabbar__grip" aria-hidden="true"></div>

        <h2 class="tabbar__sheet-title">과목</h2>
        <div class="tabbar__grid">
            <a th:each="s : ${navSubjects}" th:href="@{/{slug}(slug=${s.slug})}" class="tabbar__sheet-item"
               th:classappend="${currentSubject == s.slug} ? ' tabbar__sheet-item--active'"
               th:attr="aria-current=${currentSubject == s.slug} ? 'true' : null">
                <span class="tabbar__dot" th:style="'background: ' + ${s.colorAccent}" aria-hidden="true"></span>
                <span th:text="${s.name}">과목</span>
            </a>
        </div>

        <h2 class="tabbar__sheet-title">그 밖에</h2>
        <div class="tabbar__grid">
            <a th:href="@{/errors}" class="tabbar__sheet-item"
               th:classappend="${currentSection == 'errors'} ? ' tabbar__sheet-item--active'"
               th:attr="aria-current=${currentSection == 'errors'} ? 'true' : null">
                <span class="tabbar__dot tabbar__dot--plain" aria-hidden="true"></span>
                <span>에러 사전</span>
            </a>
            <a th:href="@{/interview}" class="tabbar__sheet-item" rel="nofollow"
               th:classappend="${currentPage == 'interview'} ? ' tabbar__sheet-item--active'"
               th:attr="aria-current=${currentPage == 'interview'} ? 'true' : null">
                <span class="tabbar__dot tabbar__dot--plain" aria-hidden="true"></span>
                <span>면접 대비</span>
            </a>
        </div>
    </div>
</th:block>
